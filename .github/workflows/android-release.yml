name: Build & Release Signed Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Signed APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure pre-installed Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "::error::Android SDK directory not found at $SDK_ROOT"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          if [ -n "$SDKMANAGER" ]; then
            (yes || true) | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          fi

      - name: Compute auto-incrementing version
        id: version
        run: |
          CODE=$((100 + GITHUB_RUN_NUMBER))
          NAME="1.0.${GITHUB_RUN_NUMBER}"
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag_name=v$NAME" >> "$GITHUB_OUTPUT"
          echo "Auto Version: $NAME (versionCode=$CODE)"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps --no-audit --no-fund
          fi

      - name: Run unit tests & lint
        run: |
          npx --no-install tsx --test src/utils/ledger.test.ts src/utils/updater.test.ts src/utils/receiptGenerator.test.ts
          npm run lint

      - name: Build web bundle with baked release metadata
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.version_name }}
          VITE_APP_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VITE_GITHUB_REPO: ${{ github.repository }}
        run: npm run build

      - name: Ensure Android google-services.json & sync Capacitor assets
        run: |
          if [ ! -f android/app/google-services.json ] && [ -f public/assets/aistudio/google-services__5__eaa6020f.json ]; then
            cp public/assets/aistudio/google-services__5__eaa6020f.json android/app/google-services.json
          fi
          npx --no-install cap sync android

      - name: Validate persistent release signing keystore secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "::error::Missing persistent signing secrets! Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD in GitHub Repo Settings -> Secrets and variables -> Actions. See ANDROID_GITHUB_SETUP.md."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > android/app/release-keystore.jks
          if [ ! -s android/app/release-keystore.jks ]; then
            echo "::error::Decoded keystore file is empty. Please re-check ANDROID_KEYSTORE_BASE64 secret."
            exit 1
          fi

      - name: Build signed Release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: release-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          APP_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PAPP_VERSION_CODE="$APP_VERSION_CODE" \
            -PAPP_VERSION_NAME="$APP_VERSION_NAME" \
            -PGITHUB_REPO="$GITHUB_REPO" \
            -PANDROID_KEYSTORE_PATH="$ANDROID_KEYSTORE_PATH" \
            -PANDROID_KEYSTORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD" \
            -PANDROID_KEY_ALIAS="$ANDROID_KEY_ALIAS" \
            -PANDROID_KEY_PASSWORD="$ANDROID_KEY_PASSWORD"

      - name: Cleanup decoded keystore
        if: always()
        run: rm -f android/app/release-keystore.jks

      - name: Prepare release APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "IbnSina-TallyKhata-${{ steps.version.outputs.tag_name }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: IbnSina-TallyKhata-${{ steps.version.outputs.tag_name }}
          path: IbnSina-TallyKhata-${{ steps.version.outputs.tag_name }}.apk

      - name: Prepare release changelog
        run: |
          {
            echo "versionCode: ${{ steps.version.outputs.version_code }}"
            echo ""
            if [ -s RELEASE_NOTES.md ]; then
              cat RELEASE_NOTES.md
              echo ""
            fi
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
            if [ -n "$PREV_TAG" ]; then
              git log "${PREV_TAG}..HEAD" --no-merges --pretty=format:"- %s"
            else
              git log -n 5 --no-merges --pretty=format:"- %s"
            fi
            echo ""
          } > release_notes.txt

      - name: Publish signed APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: ইবনে সিনা টালিখাতা ${{ steps.version.outputs.tag_name }}
          draft: false
          prerelease: false
          body_path: release_notes.txt
          files: IbnSina-TallyKhata-${{ steps.version.outputs.tag_name }}.apk
